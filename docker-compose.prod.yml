services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portask
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portask}
      POSTGRES_DB: portask
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portask -d portask"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./api
      target: prod
    image: ghcr.io/${IMAGE_NAMESPACE:-portask}/portask-api:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql://portask:${POSTGRES_PASSWORD:-portask}@db:5432/portask
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your environment}
      PORT: 5000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      NODE_ENV: production
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in your environment}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in your environment}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      # One hop for the bundled nginx. Raise it if another proxy (e.g. a TLS
      # terminating load balancer) sits in front of it.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Leave empty to mark the session cookie Secure only on HTTPS requests.
      # Set to false only for an intentionally plain-HTTP deployment.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
    volumes:
      - uploads:/app/uploads
      - api-data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: prod
    image: ghcr.io/${IMAGE_NAMESPACE:-portask}/portask-frontend:${IMAGE_TAG:-latest}
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  api-data: