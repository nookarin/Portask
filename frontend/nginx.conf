map $http_x_forwarded_proto $portask_forwarded_proto {
    # Keep the browser-facing protocol when TLS is terminated by a proxy in front of
    # this container; fall back to the local scheme for direct connections. Without
    # this the API would always see "http" and never mark the session cookie Secure.
    # Only the left-most value of a proxy chain is honoured, and only when it is a
    # well-formed "http"/"https", so a malformed header cannot override the scheme.
    default       $scheme;
    "~*^https(,|$)" https;
    "~*^http(,|$)"  http;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $portask_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /public/ {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $portask_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /uploads/ {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $portask_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}