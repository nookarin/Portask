services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portask
      POSTGRES_PASSWORD: portask
      POSTGRES_DB: portask
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portask -d portask"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      target: dev
    environment:
      DATABASE_URL: postgresql://portask:portask@db:5432/portask
      JWT_SECRET: ${JWT_SECRET:-super-secret-change-me-in-production}
      PORT: 5000
      FRONTEND_URL: http://localhost:5173
      NODE_ENV: development
    ports:
      - "5000:5000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        npx prisma db push --skip-generate &&
        npm run seed &&
        npm run dev
      "
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_URL: http://localhost:5000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
  uploads: